services:
  postgres:
    image: postgres:16-alpine
    container_name: dourak-postgres
    environment:
      POSTGRES_DB: dourak
      POSTGRES_USER: dourak
      POSTGRES_PASSWORD: dourak_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dourak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dourak -d dourak"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/Dourak.Api/Dockerfile
    container_name: dourak-api
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=dourak;Username=dourak;Password=dourak_dev_password"
      Jwt__Secret: "${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_IN_PRODUCTION_ENVIRONMENT_VARIABLE}"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      # Flutter web dev server (mobile/) — pinned via `flutter run -d chrome --web-port=8090`
      # so this origin stays stable across runs instead of a random port each time.
      Cors__AllowedOrigins__1: "http://localhost:8090"
      # Fallback when 8090 is already taken by another project's container on this machine
      # (e.g. another repo's Caddy bound to it) — same idea, just a spare pinned port.
      Cors__AllowedOrigins__2: "http://localhost:8091"
      # Note: the admin site (admin.dourak.money) does NOT need a CORS entry here — its own
      # Caddy container proxies /api/* to this same api container internally (see
      # admin/Caddyfile), so its browser calls are same-origin, not cross-origin.
      ASPNETCORE_ENVIRONMENT: "Production"
      # Base URL used to build email-verification / password-reset links. Override with
      # ${FRONTEND_BASE_URL} in .env if this ever differs (e.g. a staging domain).
      App__FrontendBaseUrl: "${FRONTEND_BASE_URL:-https://dourak.money}"
      # No SMTP provider configured yet (see docs/future-work.md) -> verification/reset
      # emails are logged instead of sent (see LoggingEmailSender). Set these via .env once
      # a provider (Zoho Mail, Resend, etc.) is set up to switch to real delivery.
      Email__Host: "${SMTP_HOST:-}"
      Email__Port: "${SMTP_PORT:-587}"
      Email__User: "${SMTP_USER:-}"
      Email__Password: "${SMTP_PASSWORD:-}"
      Email__FromAddress: "${SMTP_FROM_ADDRESS:-no-reply@dourak.money}"
      Email__FromName: "Dourak"
      # Admin site login (admin.dourak.money) — up to 3 static admin accounts, same
      # array-via-env-var pattern as Cors__AllowedOrigins__N above. Empty by default, so no
      # admin account exists until set in .env. Safe to add/remove entries later; the seeder
      # just adds the Admin role to each configured account (or creates it) on every startup,
      # idempotently — an already-existing account only gets the role, its password is
      # untouched (so this also works to promote an existing regular user to admin).
      Admin__Accounts__0__Email: "${ADMIN_1_EMAIL:-}"
      Admin__Accounts__0__Password: "${ADMIN_1_PASSWORD:-}"
      Admin__Accounts__1__Email: "${ADMIN_2_EMAIL:-}"
      Admin__Accounts__1__Password: "${ADMIN_2_PASSWORD:-}"
      Admin__Accounts__2__Email: "${ADMIN_3_EMAIL:-}"
      Admin__Accounts__2__Password: "${ADMIN_3_PASSWORD:-}"
      # "Sign in with Google" — hidden on the login page until GOOGLE_CLIENT_ID is set in .env
      # (a Google Cloud OAuth client's ID, not secret — this flow never needs the secret).
      # GOOGLE_SIGNIN_ENABLED is a separate kill switch: set to false to hide the button
      # immediately without touching the client ID (e.g. during an incident), then back to
      # true to restore it — no other config or code change either way.
      Auth__Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Auth__Google__SignInEnabled: "${GOOGLE_SIGNIN_ENABLED:-true}"
      # Phase 2: payment-claim evidence is written to disk inside the container; the named
      # volume below is what makes it survive `docker compose up -d --build`.
      Storage__EvidencePath: "/app/data/evidence"
      # Serilog's sinks come entirely from appsettings.json's "Serilog:WriteTo" array
      # (Console + a rolling file under /app/logs, matching the volume above). This
      # adds a third sink — Seq — the same way Cors__AllowedOrigins__0 above adds an
      # array element via env vars, so Program.cs never has an `if` deciding whether
      # Seq is on; it's purely a configuration difference between environments.
      # "seq" (not localhost) because containers reach each other by service name;
      # port 80 because that's Seq's port *inside* its own container, not the 5341
      # host-side mapping on the seq service below.
      Serilog__WriteTo__2__Name: "Seq"
      Serilog__WriteTo__2__Args__serverUrl: "http://seq:80"
    volumes:
      - dourak-evidence-data:/app/data/evidence
      - dourak-api-logs:/app/logs
    ports:
      - "5000:8080"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    container_name: dourak-web
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy's ACME account + issued Let's Encrypt certs — must persist across
      # `docker compose up -d --build`, or every rebuild re-requests a fresh
      # certificate (Let's Encrypt rate-limits repeated issuance for the same domain).
      - dourak-caddy-data:/data
      - dourak-caddy-config:/config

  # Admin site (admin.dourak.money) — separate codebase (admin/), gated by the Admin Identity
  # role rather than a separate user store. Not published on the host: the "web" service's
  # Caddy (above) reverse-proxies admin.dourak.money to this container internally and owns
  # the public HTTPS cert for it, same pattern as api/8080 above.
  admin-web:
    build:
      context: ./admin
      args:
        VITE_API_BASE_URL: /api
    container_name: dourak-admin-web
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Postgres GUI client (prompt02 §Other requirement).
  #
  # Adminer, not pgAdmin. Both browse tables and run queries; the difference is cost:
  # Adminer is a single ~10 MB stateless PHP page, while pgAdmin is a ~600 MB stateful
  # container that needs its own volume, its own account store, and its own upgrade path.
  # For "open the database and look at it" on a small Oracle Cloud box, Adminer is the
  # lighter, lower-maintenance choice — and its login IS the Postgres login, so there is no
  # second set of credentials to create, rotate, or leak.
  #
  # SECURITY TRADEOFF (deliberate, explicitly requested — flagged rather than silently
  # exposed): also reachable publicly at https://db.dourak.money (see frontend/Caddyfile),
  # with NO authentication in front of it beyond Adminer's own Postgres login form. Anyone
  # who has that URL can attempt to log in with any Postgres credentials they can guess/
  # obtain — there is no rate limiting or MFA. The 127.0.0.1 port binding below is kept as a
  # secondary/fallback access path (SSH tunnel), not the access control it originally was:
  #
  #     ssh -L 8081:127.0.0.1:8081 <user>@<server>     # then open http://localhost:8081
  #
  # If this should be locked back down, remove the db.dourak.money block from
  # frontend/Caddyfile (put it back behind Caddy `basic_auth` first if public access is
  # still wanted) — the loopback binding below is unaffected either way.
  #
  # Locally this is identical: http://localhost:8081, log in with
  #   System: PostgreSQL  ·  Server: postgres  ·  Username: dourak  ·  Database: dourak
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:4-standalone
    container_name: dourak-adminer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Seq — structured log server. The API ships every log event to it (see
  # Seq__ServerUrl on the api service above) in addition to the console and the
  # rolling file under the dourak-api-logs volume, so logs survive container
  # restarts and are queryable/filterable in one place instead of grepping text.
  #
  # SECURITY: same tradeoff as Adminer above — also reachable publicly at
  # https://logs.dourak.money (see frontend/Caddyfile) with NO authentication at all (Seq's
  # own login is explicitly disabled below), explicitly requested. Anyone with that URL can
  # read every structured log event. The 127.0.0.1 binding remains as a fallback:
  #     ssh -L 5341:127.0.0.1:5341 <user>@<server>     # then open http://localhost:5341
  # To lock this back down: remove the logs.dourak.money block from frontend/Caddyfile, and/
  # or set SEQ_FIRSTRUN_NOAUTHENTICATION back to a real admin password below.
  # ---------------------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: dourak-seq
    environment:
      ACCEPT_EULA: "Y"
      # Seq requires either an admin password or an explicit opt-out on first run — opted
      # out here (see the SECURITY comment above; this is what actually removes Seq's own
      # login, on top of the public logs.dourak.money exposure).
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - dourak-seq-data:/data
    ports:
      - "127.0.0.1:5341:80"
    restart: unless-stopped

volumes:
  dourak-postgres-data:
  dourak-evidence-data:
  dourak-api-logs:
  dourak-seq-data:
  dourak-caddy-data:
  dourak-caddy-config:
