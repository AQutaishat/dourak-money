services:
  postgres:
    image: postgres:16-alpine
    container_name: dourak-postgres
    environment:
      POSTGRES_DB: dourak
      POSTGRES_USER: dourak
      POSTGRES_PASSWORD: dourak_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dourak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dourak -d dourak"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/Dourak.Api/Dockerfile
    container_name: dourak-api
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=dourak;Username=dourak;Password=dourak_dev_password"
      Jwt__Secret: "${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_IN_PRODUCTION_ENVIRONMENT_VARIABLE}"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      ASPNETCORE_ENVIRONMENT: "Production"
      # Phase 2: payment-claim evidence is written to disk inside the container; the named
      # volume below is what makes it survive `docker compose up -d --build`.
      Storage__EvidencePath: "/app/data/evidence"
      # Structured logs also ship to Seq (see the "seq" service below) in addition to
      # console + the rolling file under /app/logs. Container name, not localhost —
      # this env var travels with the container on both local compose and production.
      # datalust/seq listens on port 80 *inside* the container (mapped to host 5341
      # below) — from another container on the same compose network it's reached
      # at http://seq:80, not :5341.
      Seq__ServerUrl: "http://seq:80"
    volumes:
      - dourak-evidence-data:/app/data/evidence
      - dourak-api-logs:/app/logs
    ports:
      - "5000:8080"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: dourak-web
    depends_on:
      - api
    ports:
      - "80:80"

  # ---------------------------------------------------------------------------
  # Postgres GUI client (prompt02 §Other requirement).
  #
  # Adminer, not pgAdmin. Both browse tables and run queries; the difference is cost:
  # Adminer is a single ~10 MB stateless PHP page, while pgAdmin is a ~600 MB stateful
  # container that needs its own volume, its own account store, and its own upgrade path.
  # For "open the database and look at it" on a small Oracle Cloud box, Adminer is the
  # lighter, lower-maintenance choice — and its login IS the Postgres login, so there is no
  # second set of credentials to create, rotate, or leak.
  #
  # SECURITY TRADEOFF (deliberate, flagged rather than silently exposed):
  # the port is published on 127.0.0.1 only, so Adminer is NOT reachable from the internet
  # on the production host even though the service runs there. Reach it over an SSH tunnel:
  #
  #     ssh -L 8081:127.0.0.1:8081 <user>@<server>     # then open http://localhost:8081
  #
  # Rationale: Adminer authenticates against Postgres, so exposing it publicly would put a
  # form that accepts database credentials on the open internet — one weak password away
  # from full data access, with no rate limiting or MFA in front of it. Binding to loopback
  # means an attacker must already hold SSH access to the server before they can even see
  # the login page, which is the same bar that protects `psql` on the box today. If public
  # access is ever genuinely needed, put it behind the existing Caddy reverse proxy with
  # HTTPS plus basic auth, and only then change this binding.
  #
  # Locally this is identical: http://localhost:8081, log in with
  #   System: PostgreSQL  ·  Server: postgres  ·  Username: dourak  ·  Database: dourak
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:4-standalone
    container_name: dourak-adminer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Seq — structured log server. The API ships every log event to it (see
  # Seq__ServerUrl on the api service above) in addition to the console and the
  # rolling file under the dourak-api-logs volume, so logs survive container
  # restarts and are queryable/filterable in one place instead of grepping text.
  #
  # SECURITY: same reasoning as Adminer above — Seq's own UI has no auth enabled
  # by default, so it is bound to 127.0.0.1 only, on both local dev and production.
  # Reach it on the server via an SSH tunnel:
  #     ssh -L 5341:127.0.0.1:5341 <user>@<server>     # then open http://localhost:5341
  # If you want it reachable without a tunnel, set Seq's ACCEPT_EULA/admin
  # password and put it behind Caddy with HTTPS + basic auth first.
  # ---------------------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: dourak-seq
    environment:
      ACCEPT_EULA: "Y"
      # Seq requires either an admin password or an explicit opt-out on first run.
      # Since Seq itself is bound to 127.0.0.1 only (see the port mapping and the
      # comment above), an SSH-tunnel is already the access control; skipping its
      # own login is an acceptable tradeoff for that loopback-only exposure.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - dourak-seq-data:/data
    ports:
      - "127.0.0.1:5341:80"
    restart: unless-stopped

volumes:
  dourak-postgres-data:
  dourak-evidence-data:
  dourak-api-logs:
  dourak-seq-data:
