name: Deploy to production

# Manual-only: trigger from the Actions tab ("Deploy to production" -> Run workflow).
# Tests/builds both apps first (a broken commit never reaches the server this way),
# then SSHes into the Oracle box and re-deploys via the same
# `git pull && docker compose up -d --build` flow described in README.md — just
# automated instead of typed by hand each time.
on:
  workflow_dispatch: {}

jobs:
  backend-tests:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore backend/Dourak.sln
      - name: Build
        run: dotnet build backend/Dourak.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test backend/Dourak.sln --no-build --configuration Release

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Oracle server
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.ORACLE_DEPLOY_PATH }}"
            # Back up the DB + evidence volume before touching anything, using
            # whatever backup-prod.sh already exists on disk (not the incoming
            # version) in case this pull is the one introducing a bad change.
            bash scripts/backup-prod.sh
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
