<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dourak favicon: the approved "circle of members" app icon (icons/variation-06-dots-circle-clean-APPROVED.png),
       recreated as SVG so it stays crisp at browser-tab sizes instead of scaling a raster PNG down. -->
  <defs>
    <radialGradient id="dourak-bg" cx="32%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#1f8a70" />
      <stop offset="60%" stop-color="#0f6b57" />
      <stop offset="100%" stop-color="#0a4f41" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#dourak-bg)" />
  <g transform="translate(32,33) scale(0.205)">
    <!-- Guide ring representing the circle of members -->
    <circle cx="0" cy="0" r="72" stroke="rgba(255,255,255,0.35)" stroke-width="7" fill="none"/>
    <!-- Member dots evenly spaced around the ring (5 members) -->
    <circle cx="0" cy="-72" r="16" fill="#FFFFFF"/>
    <circle cx="63" cy="-35" r="13" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="41" cy="64" r="13" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="-41" cy="64" r="13" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="-63" cy="-35" r="13" fill="#FFFFFF" opacity="0.85"/>
    <!-- Current turn holder, highlighted gold ring -->
    <circle cx="0" cy="-72" r="21" fill="none" stroke="#FFD166" stroke-width="5"/>
  </g>
</svg>
