org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
# No legacy support-library deps in this project (all plugins are AndroidX-native),
# so Jetifier has nothing to rewrite — disabling it skips a heavy, memory-hungry
# transform pass on every dependency jar.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin's build-tools-api incremental caching hits a Windows-specific storage
# double-registration bug (KT-*) with parallel workers on this Kotlin/Gradle
# combo; disabling incremental compilation avoids it. Debug-build-only concern,
# not a runtime behavior change.
kotlin.incremental=false
org.gradle.parallel=false
