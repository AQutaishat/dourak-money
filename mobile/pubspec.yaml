name: dourak_mobile
description: "Dourak — savings circle organizer (Flutter/Android mirror of the web app)."
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  url_launcher: ^6.3.0
  file_picker: ^10.3.3
  app_links: ^7.2.1
  # "Sign in with Google" — off until the backend's /auth/config reports a client ID (see
  # LoginScreen). Configured with `serverClientId` (the web OAuth client, not a separate
  # Android one) so the ID token it returns is already the audience the backend validates.
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/dourak_logo.png
